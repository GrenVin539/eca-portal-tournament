tter-spacing:.1em}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tile,.panel{border:1px solid var(--line);background:linear-gradient(145deg,#142b4b,#0b172b);border-radius:16px;padding:19px;box-shadow:0 14px 36px #0005,inset 0 1px #ffffff08}.tile h3{font-size:21px;margin:7px 0}.tile p,.muted{color:var(--muted);font-size:12px}.btn{display:inline-block;background:var(--lime);color:#101827;text-decoration:none;border:0;border-radius:9px;padding:11px 15px;font-size:10px;font-weight:950;letter-spacing:.1em}.submit{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:16px 18px;border:1px solid #3b5a76;background:linear-gradient(100deg,#18314d,#10233a);border-radius:14px;margin-bottom:14px}.submit strong{font-size:14px}.submit p{margin:4px 0 0;color:var(--muted);font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:13px 0}.stat{background:#111f34;border:1px solid var(--line);border-radius:11px;padding:12px}.stat small{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em}.stat strong{font-size:15px}.archive{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:#101d30;border:1px solid var(--line);border-radius:11px;margin:12px 0}.archive select{background:#091426;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px}.content{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:13px}.panelHead{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}.panelHead h3{font-size:14px;margin:0}.bracketBody{overflow-x:auto;padding-top:14px}.bracket{display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));gap:10px;min-width:630px}.roundTitle{font-size:10px;color:var(--cyan);font-weight:950;letter-spacing:.1em;margin-bottom:10px}.roundTitle.final{color:var(--gold)}.matches{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-height:340px}.match{border:1px solid #2b4261;background:#0b1729;border-radius:9px;padding:9px;font-size:10px}.team{display:flex;justify-content:space-between;gap:7px;padding:4px 0}.team+.team{border-top:1px solid #233752}.winner{color:var(--lime);font-weight:900}.score{color:var(--gold);font-weight:900}.highlights h3{font-size:11px;letter-spacing:.12em;margin:0 0 12px}.highlight{padding:12px 0;border-bottom:1px solid var(--line)}.highlight:last-child{border:0}.highlight small{color:var(--muted);font-size:9px;letter-spacing:.1em}.highlight strong{display:block;margin-top:4px}.champ{display:flex;gap:10px;align-items:center;background:#1c3042;border:1px solid #50643a;border-radius:10px;padding:10px}.trophy{font-size:26px}.roundTabs{display:none;gap:6px;flex-wrap:wrap;margin:12px 0}.roundTabs button{background:#15263d;color:var(--txt);border:1px solid var(--line);padding:7px 9px;border-radius:8px;font-size:10px}.roundTabs button.active{background:var(--cyan);color:#071321}.doubleBracket{display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));gap:10px;align-items:start;min-width:650px}.doubleBracket .grandRound{border-color:#98762f;background:linear-gradient(145deg,#302817,#0d192b)}.groupBracket{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.finalFourBracket{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.doubleBracket .round,.groupBracket .round,.finalFourBracket .round{min-width:0}.groupBracket .matches{min-height:0;gap:8px}.finalFourBracket .matches{min-height:0}.roundTitle{margin-bottom:10px}@media(max-width:850px){.groupBracket{grid-template-columns:repeat(2,minmax(0,1fr))}.finalFourBracket{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.doubleBracket{min-width:0;grid-template-columns:1fr}.groupBracket,.finalFourBracket{grid-template-columns:1fr}}

/* Double Elimination visual identity: Winners green, Losers red, Grand Final gold */
.doubleBracket .winnersRound .roundTitle{color:#55e28a}
.doubleBracket .winnersRound .match{border-color:#28734b;background:linear-gradient(145deg,rgba(23,92,55,.22),#0b1729 72%)}
.doubleBracket .winnersRound .team:first-child{color:#d9ffe6}
.doubleBracket .losersRound .roundTitle{color:#ff777e}
.doubleBracket .losersRound .match{border-color:#8a3942;background:linear-gradient(145deg,rgba(130,35,45,.24),#0b1729 72%)}
.doubleBracket .losersRound .team:first-child{color:#ffe1e2}
.doubleBracket .grandRoundGold{border:1px solid #c99b36;border-radius:12px;padding:10px;background:linear-gradient(150deg,rgba(161,116,24,.28),rgba(13,25,43,.96))}
.doubleBracket .grandRoundGold .roundTitle{color:#ffd45c}
.doubleBracket .grandRoundGold .match{border-color:#c99b36;background:linear-gradient(145deg,#3a2d12,#101a2b)}
.doubleBracket .grandRoundGold .team{color:#fff0bd}


/* Mobile: Winners flow downward, Grand Final stays centered, Losers flow upward */
@media(max-width:650px){
  .doubleBracket>.round:nth-child(1){order:1}
  .doubleBracket>.round:nth-child(2){order:2}
  .doubleBracket>.round:nth-child(3){order:3}
  .doubleBracket>.round:nth-child(4){order:4}
  .doubleBracket>.round:nth-child(8){order:5} /* LOSERS FINAL */
  .doubleBracket>.round:nth-child(7){order:6} /* LOSERS SEMI FINAL */
  .doubleBracket>.round:nth-child(6){order:7} /* LOSERS R2 */
  .doubleBracket>.round:nth-child(5){order:8} /* LOSERS R1 */
}

/* Custom season dropdown: avoid native grey OS/browser popup */
.seasonPicker{position:relative;width:min(100%,360px);z-index:20}
.seasonPickerTrigger{width:100%;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 14px;background:linear-gradient(135deg,#132943,#0a1729);color:#f4f7ff;border:1px solid #365477;border-radius:10px;font:inherit;font-weight:800;text-align:left;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff0b;transition:border-color .18s,box-shadow .18s,background .18s}
.seasonPickerTrigger:hover,.seasonPickerTrigger[aria-expanded="true"]{border-color:#35d7f5;box-shadow:0 0 0 3px #27c9ed22,0 8px 22px #0005}
.seasonPickerChevron{color:#f5c84b;font-size:23px;line-height:16px;transition:transform .18s}
.seasonPickerTrigger[aria-expanded="true"] .seasonPickerChevron{transform:rotate(180deg)}
.seasonPickerMenu{position:absolute;top:calc(100% + 7px);left:0;right:0;max-height:260px;overflow-y:auto;padding:6px;background:#0b192c;border:1px solid #3b5d82;border-radius:12px;box-shadow:0 16px 38px #000b;z-index:9999}
.seasonPickerMenu[hidden]{display:none}
.seasonPickerOption{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;background:transparent;color:#e8f0fc;border:0;border-radius:8px;font:inherit;font-weight:700;text-align:left;cursor:pointer}
.seasonPickerOption:hover,.seasonPickerOption:focus-visible{background:#173552;color:#fff;outline:2px solid #31c9e9;outline-offset:-2px}
.seasonPickerOption.active{background:linear-gradient(90deg,#493817,#29243a);color:#ffdc75}
.seasonCheck{color:#ffdc75;font-weight:950}
@media(max-width:600px){.seasonPicker{width:100%}.seasonPickerMenu{max-height:220px}}
